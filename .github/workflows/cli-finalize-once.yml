name: Finalize Threadmoth CLI once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply final CLI compiler fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/threadmoth_cli.rs')
          s = p.read_text()
          old = 'generate(shell.into(), &mut command, "threadmoth", &mut io::stdout());'
          new = 'generate::<clap_complete::Shell, _>(shell.into(), &mut command, "threadmoth", &mut io::stdout());'
          if old not in s and new not in s:
              raise SystemExit('completion call not found')
          p.write_text(s.replace(old, new))
          PY
          cargo fmt
          cargo check --all-targets --all-features
      - name: Commit generated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli.rs src/cli_mcp.rs src/threadmoth_cli.rs Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "finalize Threadmoth 1.3 CLI sources"
          git push
