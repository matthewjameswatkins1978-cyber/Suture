name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: suture-linux-x86_64
            binary: suture
          - os: windows-latest
            artifact: suture-windows-x86_64
            binary: suture.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package Unix
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C target/release suture
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/suture.exe -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Checksums Unix
        if: runner.os != 'Windows'
        run: sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.sha256"
      - name: Checksums Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii "${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write release manifest
        shell: bash
        run: |
          tar -xzf dist/suture-linux-x86_64.tar.gz -C dist
          protocol_version=$(dist/suture capabilities --json --all | jq -r '.protocol_version')
          printf '%s\n' '{' '  "protocol_version": "'"$protocol_version"'",' '  "artifacts": [' > dist/release-manifest.json
          first=1
          for file in dist/suture-*.*; do
            case "$file" in *.sha256|*.json) continue;; esac
            hash=$(sha256sum "$file" | cut -d' ' -f1)
            [ "$first" -eq 1 ] || printf '%s\n' ',' >> dist/release-manifest.json
            printf '    {"name":"%s","sha256":"%s"}' "$(basename "$file")" "$hash" >> dist/release-manifest.json
            first=0
          done
          printf '%s\n' '  ]' '}' >> dist/release-manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
