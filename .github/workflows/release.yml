name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: threadmoth-linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: threadmoth
          - os: windows-latest
            artifact: threadmoth-windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: threadmoth.exe
          - os: macos-14
            artifact: threadmoth-macos-aarch64
            target: aarch64-apple-darwin
            binary: threadmoth
          - os: macos-15-intel
            artifact: threadmoth-macos-x86_64
            target: x86_64-apple-darwin
            binary: threadmoth
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: cargo run --locked --release --target ${{ matrix.target }} -- benchmark --quick --json
      - run: cargo run --locked --release --target ${{ matrix.target }} -- benchmark --torture --json
      - run: cargo run --locked --release --target ${{ matrix.target }} -- --version
      - run: cargo run --locked --release --target ${{ matrix.target }} -- doctor
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package/completions
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} package/${{ matrix.binary }}
          target/${{ matrix.target }}/release/${{ matrix.binary }} completions bash > package/completions/threadmoth.bash
          target/${{ matrix.target }}/release/${{ matrix.binary }} completions zsh > package/completions/_threadmoth
          target/${{ matrix.target }}/release/${{ matrix.binary }} completions fish > package/completions/threadmoth.fish
          target/${{ matrix.target }}/release/${{ matrix.binary }} manpage --output package/threadmoth.1
          test -s package/${{ matrix.binary }}
          test "$(package/${{ matrix.binary }} --version)" = "threadmoth 1.7.0"
          tar -czf ${{ matrix.artifact }}.tar.gz -C package .
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          New-Item -ItemType Directory -Force package/completions | Out-Null
          Copy-Item target/${{ matrix.target }}/release/threadmoth.exe package/threadmoth.exe
          target/${{ matrix.target }}/release/threadmoth.exe completions powershell | Out-File -Encoding utf8 package/completions/threadmoth.ps1
          target/${{ matrix.target }}/release/threadmoth.exe manpage --output package/threadmoth.1
          if ((Get-Item package/threadmoth.exe).Length -le 0) { throw 'packaged binary is empty' }
          if ((target/${{ matrix.target }}/release/threadmoth.exe --version) -ne 'threadmoth 1.7.0') { throw 'packaged version mismatch' }
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Checksums Unix
        if: runner.os != 'Windows'
        run: shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.sha256"
      - name: Checksums Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii "${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write release manifest
        shell: bash
        run: |
          mkdir -p dist/unpacked
          tar -xzf dist/threadmoth-linux-x86_64.tar.gz -C dist/unpacked
          protocol_version=$(dist/unpacked/threadmoth capabilities --json --all | jq -r '.protocol_version')
          printf '%s\n' '{' '  "protocol_version": "'"$protocol_version"'",' '  "artifacts": [' > dist/release-manifest.json
          first=1
          for file in dist/threadmoth-*.*; do
            case "$file" in *.sha256|*.json) continue;; esac
            hash=$(sha256sum "$file" | cut -d' ' -f1)
            [ "$first" -eq 1 ] || printf '%s\n' ',' >> dist/release-manifest.json
            printf '    {"name":"%s","sha256":"%s"}' "$(basename "$file")" "$hash" >> dist/release-manifest.json
            first=0
          done
          printf '%s\n' '  ]' '}' >> dist/release-manifest.json
          rm -rf dist/unpacked
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
